<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Voice Agent — Call Visualizer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     Call Visualizer — GrowthMindset.ai
     Standalone, dependency-free. Drop-in reference for production.
     Palette + type follow the GrowthMindset.ai design system.
     ============================================================ */
  :root{
    --accent:#00D4FF;        /* brand cyan signal */
    --accent-bright:#5CE1FF;
    --warm:#F5A524;          /* amber = the human / caller */
    --ink:#E6EDF3; --muted:#9BA7B4; --dim:#697586; --faint:#3B424E;
    --hairline:rgba(148,163,184,0.20);
    --font-display:'Space Grotesk',system-ui,sans-serif;
    --font-body:'Inter',system-ui,sans-serif;
    --font-mono:'JetBrains Mono',ui-monospace,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       padding:40px 32px;background:radial-gradient(90% 70% at 50% -10%,#0D1117 0%,#0A0A0F 70%);
       font-family:var(--font-body);}

  .cv-card{position:relative;display:flex;flex-direction:column;width:100%;max-width:760px;
       aspect-ratio:16/9;padding:22px 26px 20px;border-radius:24px;
       background:radial-gradient(130% 110% at 50% -8%,#1A1E29 0%,#12141C 52%,#0C0E15 100%);
       border:1px solid var(--hairline);
       box-shadow:inset 0 1px 0 rgba(255,255,255,0.06),0 30px 70px -26px rgba(0,0,0,0.8);
       overflow:hidden;cursor:pointer;color:var(--ink);outline:none;-webkit-tap-highlight-color:transparent;}
  .cv-card:focus-visible{border-color:rgba(0,212,255,0.55);
       box-shadow:inset 0 1px 0 rgba(255,255,255,0.06),0 0 0 3px rgba(0,212,255,0.28),0 30px 70px -26px rgba(0,0,0,0.8);}

  .cv-media{position:absolute;top:0;left:0;width:1px;height:1px;opacity:.01;pointer-events:none;}

  .cv-hdr{position:relative;z-index:6;display:flex;align-items:center;justify-content:space-between;gap:16px;}
  .cv-hdr-l{display:flex;align-items:center;gap:9px;min-width:0;}
  .cv-phone{display:inline-flex;color:var(--accent);}
  .cv-kicker{font-family:var(--font-mono);font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--dim);white-space:nowrap;}
  .cv-kicker .sep{color:var(--faint);margin:0 7px;}
  .cv-kicker .hi{color:var(--accent);}
  .cv-status{display:flex;align-items:center;gap:8px;font-family:var(--font-mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;flex-shrink:0;}
  .cv-live{display:none;align-items:center;gap:8px;color:var(--accent);}
  .cv-rec{display:flex;align-items:center;gap:8px;color:var(--dim);}
  .cv-dot{width:7px;height:7px;border-radius:50%;}
  .cv-dot.live{background:var(--accent);animation:cvDot 1.8s ease-in-out infinite;}
  .cv-dot.rec{background:var(--faint);}

  .cv-viz{position:relative;flex:1;display:flex;align-items:center;justify-content:center;margin:14px 0 6px;min-height:0;}
  .cv-glow{position:absolute;width:62%;height:74%;left:19%;top:13%;
       background:radial-gradient(closest-side,var(--accent),transparent 74%);filter:blur(40px);opacity:.16;z-index:0;pointer-events:none;will-change:opacity,transform;}
  .cv-glow-warm{position:absolute;width:50%;height:64%;left:25%;top:18%;
       background:radial-gradient(closest-side,var(--warm),transparent 72%);filter:blur(44px);opacity:0;z-index:0;pointer-events:none;will-change:opacity;}
  .cv-bars{position:relative;z-index:1;width:100%;height:100%;max-height:184px;display:flex;align-items:center;justify-content:center;gap:4px;}
  .cv-bar{flex:1 1 0;min-width:2px;max-width:9px;height:100%;border-radius:6px;transform-origin:center;
       background:linear-gradient(180deg,var(--accent-bright) 0%,var(--accent) 50%,var(--accent-bright) 100%);
       transform:scaleY(var(--sy,.055));will-change:transform;}

  .cv-overlay{position:absolute;inset:-16px -26px;z-index:4;display:flex;flex-direction:column;align-items:center;justify-content:center;
       gap:15px;text-align:center;padding:20px 28px;
       background:radial-gradient(62% 82% at 50% 50%,rgba(10,11,16,.32) 0%,rgba(10,11,16,.72) 100%);
       backdrop-filter:blur(1.5px);-webkit-backdrop-filter:blur(1.5px);}
  .cv-ring{width:66px;height:66px;border-radius:50%;display:flex;align-items:center;justify-content:center;
       background:rgba(0,212,255,.10);border:1.5px solid var(--accent);animation:cvRing 3.4s ease-in-out infinite;}
  .cv-prompt{font-family:var(--font-display);font-size:19px;font-weight:600;letter-spacing:-.01em;color:var(--ink);max-width:430px;line-height:1.32;text-wrap:balance;}
  .cv-sub{font-size:12.5px;color:var(--muted);max-width:380px;line-height:1.45;}

  .cv-caps{position:relative;z-index:5;display:none;flex-direction:column;gap:7px;height:92px;overflow:hidden;margin:2px 0 10px;justify-content:flex-end;
       -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 24px);mask-image:linear-gradient(to bottom,transparent 0,#000 24px);}
  .cap-row{display:flex;}
  .cap-bubble{max-width:80%;padding:8px 12px;border-radius:12px;border:1px solid transparent;}
  .cap-label{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:3px;}
  .cap-text{font-size:13.5px;line-height:1.4;color:var(--ink);}

  .cv-controls{position:relative;z-index:6;display:none;align-items:center;gap:14px;margin-top:auto;}
  .cv-btn{flex-shrink:0;width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;
       border:1px solid rgba(148,163,184,.28);background:rgba(148,163,184,.08);color:var(--ink);cursor:pointer;padding:0;}
  .cv-btn:hover{background:rgba(0,212,255,.12);border-color:rgba(0,212,255,.4);}
  .cv-track{flex:1;height:4px;border-radius:999px;background:rgba(148,163,184,.16);overflow:hidden;}
  .cv-fill{height:100%;width:0%;border-radius:999px;background:var(--accent);box-shadow:0 0 12px var(--accent);}
  .cv-time{flex-shrink:0;font-family:var(--font-mono);font-size:12px;color:var(--muted);letter-spacing:.03em;}
  .cv-time .now{color:var(--ink);}

  @keyframes cvDot{0%,100%{box-shadow:0 0 0 0 rgba(0,212,255,.45),0 0 10px var(--accent);}50%{box-shadow:0 0 0 5px rgba(0,212,255,0);}}
  @keyframes cvRing{0%,100%{box-shadow:0 0 0 6px rgba(0,212,255,.05),0 0 34px rgba(0,212,255,.22);}50%{box-shadow:0 0 0 9px rgba(0,212,255,.02),0 0 46px rgba(0,212,255,.34);}}
  @keyframes cvCapIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
  .anim{animation:cvCapIn .28s ease-out both;}
  @media (prefers-reduced-motion:reduce){.cv-ring,.cv-dot.live{animation:none!important;}}
</style>
</head>
<body>

    <audio class="cv-media" id="media" src="assets/call.mp3" preload="auto"></audio>

      <div class="cv-hdr-l">

        </div>

    </div>

    <div class="cv-caps" id="caps"><div id="capList"></div></div>

    <div class="cv-controls" id="controls">

        <svg id="playIco" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" style="margin-left:2px"><path d="M8 5v14l11-7z"></path></svg>
      </button>
      <div class="cv-track"><div class="cv-fill" id="fill"></div></div>
      <div class="cv-time"><span class="now" id="elapsed">0:00</span> / <span id="totalFoot">1:16</span></div>
    </div>
  </div>

    fill.style.width=(Math.min(1,t/d)*100).toFixed(2)+'%';
    var sec=Math.floor(t);
    if(sec!==lastSec){ lastSec=sec; elapsed.textContent=fmt(t); }
    var idx=-1;
    for(var i=0;i<captions.length;i++){ if(captions[i].t<=t) idx=i; else break; }
    if(idx!==capIdx){ capIdx=idx; renderCaptions(); }
  }

  function renderCaptions(){
    if(capIdx<0){ capList.innerHTML=''; caps.style.display='none'; return; }
    var start=Math.max(0,capIdx-1), html='';
    for(var k=start;k<=capIdx;k++){
      var c=captions[k], isCaller=c.speaker==='caller';
      var fg=isCaller?WARM:ACCENT;
      var bg=isCaller?'rgba(245,165,36,0.10)':'rgba(0,212,255,0.09)';
      var bd=isCaller?'rgba(245,165,36,0.28)':'rgba(0,212,255,0.24)';
      var side=isCaller?'flex-end':'flex-start';
      var label=isCaller?'Caller':'AI Agent';
      html+='<div class="cap-row anim" style="justify-content:'+side+'">'
          +'<div class="cap-bubble" style="background:'+bg+';border-color:'+bd+'">'
          +'<div class="cap-label" style="color:'+fg+'">'+label+'</div>'
          +'<div class="cap-text">'+c.text+'</div></div></div>';
    }
    capList.innerHTML=html; caps.style.display='flex';
  }

  function setMode(m){
    mode=m;
    var idle=(m==='idle'||m==='ended'), playing=(m==='playing');
    overlay.style.display=idle?'flex':'none';
    controls.style.display=idle?'none':'flex';
    live.style.display=playing?'inline-flex':'none';
    rec.style.display=playing?'none':'inline-flex';
    pauseIco.style.display=playing?'block':'none';
    playIco.style.display=playing?'none':'block';
    if(idle){ caps.style.display='none'; }
  }

  // ---- rAF loop: state is derived from the media element, so it never desyncs ----
  function frame(){
    var playing=!audio.paused && !audio.ended;
    if(playing){ playhead=audio.currentTime; renderBars(); updateTime(playhead); }
    else { renderIdle(); }
    requestAnimationFrame(frame);
  }

  function activate(){
    if(mode==='idle'||mode==='ended'){ try{audio.currentTime=0;}catch(e){} lastSec=-1; playhead=0; }
    if(!audio.paused) return;
    var p=audio.play(); if(p&&p.catch) p.catch(function(){});
  }
  function toggle(e){ if(e) e.stopPropagation(); if(audio.paused){ var p=audio.play(); if(p&&p.catch)p.catch(function(){}); } else { audio.pause(); } }

  card.addEventListener('click', activate);
  card.addEventListener('keydown', function(e){ if(e.key===' '||e.key==='Enter'){ e.preventDefault(); activate(); } });
  btn.addEventListener('click', toggle);
  audio.addEventListener('play', function(){ setMode('playing'); });
  audio.addEventListener('playing', function(){ setMode('playing'); });
  audio.addEventListener('pause', function(){ if(!audio.ended && mode==='playing') setMode('paused'); });
  audio.addEventListener('ended', function(){ playhead=0; try{audio.currentTime=0;}catch(e){} lastSec=-1; fill.style.width='0%'; elapsed.textContent='0:00'; capIdx=-1; renderCaptions(); setMode('ended'); });
  audio.addEventListener('loadedmetadata', setDur);
  audio.addEventListener('durationchange', setDur);

  setDur(); setMode('idle'); try{ audio.load(); }catch(e){}
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
