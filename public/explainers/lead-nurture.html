document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    const resourceBlobs = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

[{"id":"https://unpkg.com/react@18.3.1/umd/react.production.min.js","uuid":"80d0f026-5b02-468f-a40a-08bbd9fac211"},{"id":"https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js","uuid":"e0050059-df7c-4001-a113-18ab656a681f"}]

  <script type="__bundler/template">
"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"93baeb1f-9bfe-4bc0-9baf-5065daeb5a4f\"><\u002Fscript>\n\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n  <style>/* ============================================================\n   COLORS — GrowthMindset.ai / Matt Martelli\n   ------------------------------------------------------------\n   Two surfaces, one brand. PAPER is the default for executive\n   sales & portfolio pages (whitespace-led, premium, calm). NIGHT\n   is the brand's signature dark surface (from growthmindset.ai &\n   mattmartelli.com) used for heroes, dividers, and proof panels.\n   Cyan is the brand signal; amber marks the human / outcome.\n   ============================================================ */\n\n:root {\n  /* ---- Brand core ---- */\n  --gm-black: #0A0A0F;          /* \"night\" — brand background */\n  --gm-ink: #16181D;            /* near-black for text on paper */\n  --gm-cyan: #00D4FF;           /* brand cyan — bright, for dark surfaces */\n  --gm-cyan-bright: #22D3EE;    /* the lighter cyan used on mattmartelli.com */\n  --gm-teal: #0B7A8C;           /* deep cyan for accents ON LIGHT surfaces */\n  --gm-teal-deep: #075E6C;      /* pressed / hover deep teal */\n  --gm-amber: #F5A524;          /* human / outcome highlight */\n  --gm-amber-soft: #FBBF6B;\n\n  /* ---- Manila \"case file\" paper (the creative-brief surface) ---- */\n  --gm-manila: #F4E8CE;         /* warm folder paper */\n  --gm-manila-edge: #EADCB8;    /* folder tab / darker fold */\n  --gm-manila-line: rgba(120, 90, 40, 0.22); /* hairline on manila */\n  --gm-manila-label: #9A7B33;   /* mono field labels on manila */\n  --gm-manila-ink: #2B2310;     /* body text on manila */\n  --gm-indigo: #6366F1;         /* secondary accent — used sparingly */\n  --gm-green: #10B981;          /* success / positive delta */\n  --gm-red: #E5484D;            /* negative delta / alert */\n\n  /* ---- Neutral ramp (cool gray, paper → ink) ---- */\n  --gray-0:  #FFFFFF;\n  --gray-25: #FBFAF8;   /* warm paper */\n  --gray-50: #F5F5F4;\n  --gray-100:#ECECEA;\n  --gray-150:#E2E2DF;\n  --gray-200:#D4D6DA;\n  --gray-300:#B7BBC2;\n  --gray-400:#9098A3;\n  --gray-500:#6B7280;\n  --gray-600:#4B515B;\n  --gray-700:#343941;\n  --gray-800:#22262C;\n  --gray-900:#16181D;\n  --gray-950:#0A0A0F;\n\n  /* ---- Dark-surface ramp (layered near-blacks) ---- */\n  --night-0:  #0A0A0F;\n  --night-1:  #0D1117;  /* surface */\n  --night-2:  #12141C;  /* elevated */\n  --night-3:  #171A24;  /* raised */\n  --night-line: rgba(148, 163, 184, 0.12);\n  --night-line-strong: rgba(148, 163, 184, 0.22);\n\n  /* ============ SEMANTIC ALIASES ============ */\n\n  /* Surfaces — PAPER (default) */\n  --surface-page: var(--gray-25);\n  --surface-card: var(--gray-0);\n  --surface-sunken: var(--gray-50);\n  --surface-raised: var(--gray-0);\n\n  /* Surfaces — NIGHT */\n  --surface-night: var(--night-0);\n  --surface-night-card: var(--night-2);\n  --surface-night-raised: var(--night-3);\n\n  /* Text on paper */\n  --text-strong: var(--gray-900);\n  --text-body: var(--gray-700);\n  --text-muted: var(--gray-500);\n  --text-faint: var(--gray-400);\n  --text-on-accent: #FFFFFF;\n\n  /* Text on night */\n  --text-night-strong: #E6EDF3;\n  --text-night-body: #9BA7B4;\n  --text-night-faint: #697586;\n\n  /* Accent (primary action / links / data on light) */\n  --accent: var(--gm-teal);\n  --accent-hover: var(--gm-teal-deep);\n  --accent-contrast: #FFFFFF;\n  --accent-soft: rgba(11, 122, 140, 0.10);\n  --accent-soft-border: rgba(11, 122, 140, 0.22);\n\n  /* Accent on night */\n  --accent-night: var(--gm-cyan);\n  --accent-night-soft: rgba(0, 212, 255, 0.12);\n  --accent-night-glow: rgba(0, 212, 255, 0.35);\n\n  /* Outcome / human */\n  --outcome: var(--gm-amber);\n  --outcome-soft: rgba(245, 165, 36, 0.14);\n\n  /* Case-file surfaces */\n  --surface-brief: var(--gm-manila);\n  --text-on-brief: var(--gm-manila-ink);\n  --label-on-brief: var(--gm-manila-label);\n\n  /* Borders & dividers (on paper) */\n  --border: var(--gray-150);\n  --border-strong: var(--gray-200);\n  --border-faint: var(--gray-100);\n  --divider: var(--gray-150);\n\n  /* Status */\n  --positive: var(--gm-green);\n  --positive-soft: rgba(16, 185, 129, 0.12);\n  --negative: var(--gm-red);\n  --negative-soft: rgba(229, 72, 77, 0.12);\n\n  /* Focus ring */\n  --focus-ring: rgba(11, 122, 140, 0.45);\n}\n<\u002Fstyle>\n  <style>/* ============================================================\n   TYPOGRAPHY — GrowthMindset.ai\n   Display = Space Grotesk (headlines, numbers, eyebrows).\n   Body = Inter. Mono = JetBrains Mono (labels, data, node tags).\n   Tight, confident, executive. Type scale is a ~1.22 ratio.\n   ============================================================ */\n\n:root {\n  /* Families */\n  --font-display: 'Space Grotesk', ui-sans-serif, system-ui, sans-serif;\n  --font-body: 'Inter', ui-sans-serif, system-ui, -apple-system, sans-serif;\n  /* Typewriter — the \"case file\" voice (eyebrows, labels, stamps, flows) */\n  --font-mono: 'Courier Prime', ui-monospace, 'Courier New', monospace;\n  --font-typewriter: var(--font-mono);\n\n  /* Weights */\n  --weight-regular: 400;\n  --weight-medium: 500;\n  --weight-semibold: 600;\n  --weight-bold: 700;\n\n  /* Type scale (px) */\n  --text-display: 64px;   /* hero */\n  --text-h1: 48px;\n  --text-h2: 36px;\n  --text-h3: 27px;\n  --text-h4: 22px;\n  --text-lead: 20px;      /* intro paragraphs */\n  --text-body-lg: 18px;\n  --text-base: 16px;\n  --text-sm: 14px;\n  --text-xs: 13px;\n  --text-eyebrow: 12px;   /* mono uppercase kicker */\n\n  /* Line heights */\n  --leading-tight: 1.05;\n  --leading-snug: 1.18;\n  --leading-normal: 1.5;\n  --leading-relaxed: 1.65;\n\n  /* Letter spacing */\n  --tracking-tight: -0.025em;   /* display / h1 */\n  --tracking-snug: -0.015em;    /* h2 / h3 */\n  --tracking-normal: 0em;\n  --tracking-wide: 0.02em;\n  --tracking-eyebrow: 0.1em;    /* typewriter kickers, uppercase (Courier is wide) */\n}\n<\u002Fstyle>\n  <style>/* ============================================================\n   SPACING, RADII, SHADOWS — GrowthMindset.ai\n   4px base grid. Generous whitespace so complex thinking reads\n   as simple. Radii are restrained (premium, not bubbly).\n   Two shadow systems: soft ambient (paper) + cyan glow (night).\n   ============================================================ */\n\n:root {\n  /* ---- Spacing scale (4px grid) ---- */\n  --space-0: 0;\n  --space-1: 4px;\n  --space-2: 8px;\n  --space-3: 12px;\n  --space-4: 16px;\n  --space-5: 20px;\n  --space-6: 24px;\n  --space-8: 32px;\n  --space-10: 40px;\n  --space-12: 48px;\n  --space-16: 64px;\n  --space-20: 80px;\n  --space-24: 96px;\n  --space-32: 128px;\n\n  /* Section rhythm */\n  --section-y: 96px;       /* vertical padding for a page section */\n  --section-y-lg: 128px;\n  --gutter: 24px;          /* card / grid gutter */\n  --content-max: 1216px;   /* 76rem — max content width */\n  --reading-max: 680px;    /* comfortable prose measure */\n\n  /* ---- Radii ---- */\n  --radius-xs: 6px;\n  --radius-sm: 8px;\n  --radius: 12px;          /* default card */\n  --radius-md: 14px;\n  --radius-lg: 18px;\n  --radius-xl: 24px;\n  --radius-2xl: 28px;\n  --radius-pill: 999px;\n\n  /* ---- Borders ---- */\n  --border-width: 1px;\n  --border-width-strong: 1.5px;\n\n  /* ---- Shadows (paper) ---- */\n  --shadow-xs: 0 1px 2px rgba(16, 24, 40, 0.05);\n  --shadow-sm: 0 1px 3px rgba(16, 24, 40, 0.08), 0 1px 2px rgba(16, 24, 40, 0.04);\n  --shadow: 0 4px 12px -2px rgba(16, 24, 40, 0.08), 0 2px 6px -2px rgba(16, 24, 40, 0.05);\n  --shadow-md: 0 10px 24px -6px rgba(16, 24, 40, 0.10), 0 4px 10px -4px rgba(16, 24, 40, 0.06);\n  --shadow-lg: 0 22px 48px -12px rgba(16, 24, 40, 0.16), 0 8px 18px -8px rgba(16, 24, 40, 0.08);\n  --shadow-card: 0 1px 2px rgba(16, 24, 40, 0.04), 0 6px 20px -8px rgba(16, 24, 40, 0.10);\n\n  /* ---- Shadows (night) ---- */\n  --shadow-night: 0 1px 0 0 rgba(255,255,255,0.04) inset, 0 8px 30px -12px rgba(0,0,0,0.7);\n  --glow-cyan: 0 0 0 1px rgba(0,212,255,0.25), 0 0 40px -8px rgba(0,212,255,0.35);\n\n  /* ---- Motion ---- */\n  --ease-out: cubic-bezier(0.22, 1, 0.36, 1); /* @kind other */\n  --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1); /* @kind other */\n  --dur-fast: 140ms; /* @kind other */\n  --dur: 220ms; /* @kind other */\n  --dur-slow: 420ms; /* @kind other */\n}\n<\u002Fstyle>\n  <style>/* ============================================================\n   GrowthMindset.ai — Webfonts\n   Display: Space Grotesk (geometric grotesque, echoes the wordmark).\n   Body: Inter. Typewriter/mono: Courier Prime — the \"case file\"\n   voice: eyebrows, field labels, stamps, system-flow tags. Evokes a\n   classic typed creative brief. All loaded from Google Fonts.\n   ============================================================ */\n\n/* latin-ext */\n@font-face {\n  font-family: 'Courier Prime';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"5d90eb0a-ff97-4984-9238-8f0b9af812b6\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Courier Prime';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"fe885339-d827-4640-a492-5583dd01e93f\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Courier Prime';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"c15b7556-fba8-43cc-b6cc-c95fd9c9d9eb\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02 b-542d-4d3a-9b15-b74bbc9d0cdc\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n<\u002Fstyle>\n  <style>/* ============================================================\n   GrowthMindset.ai — Design System global entry point.\n   Consumers link THIS file. It is an import manifest only:\n   tokens first, then fonts. No rules live here directly.\n   ============================================================ */\n\n/* ============================================================\n   COLORS — GrowthMindset.ai / Matt Martelli\n   ------------------------------------------------------------\n   Two surfaces, one brand. PAPER is the default for executive\n   sales & portfolio pages (whitespace-led, premium, calm). NIGHT\n   is the brand's signature dark surface (from growthmindset.ai &\n   mattmartelli.com) used for heroes, dividers, and proof panels.\n   Cyan is the brand signal; amber marks the human / outcome.\n   ============================================================ */\n\n:root {\n  /* ---- Brand core ---- */\n  --gm-black: #0A0A0F;          /* \"night\" — brand background */\n  --gm-ink: #16181D;            /* near-black for text on paper */\n  --gm-cyan: #00D4FF;           /* brand cyan — bright, for dark surfaces */\n  --gm-cyan-bright: #22D3EE;    /* the lighter cyan used on mattmartelli.com */\n  --gm-teal: #0B7A8C;           /* deep cyan for accents ON LIGHT surfaces */\n  --gm-teal-deep: #075E6C;      /* pressed / hover deep teal */\n  --gm-amber: #F5A524;          /* human / outcome highlight */\n  --gm-amber-soft: #FBBF6B;\n\n  /* ---- Manila \"case file\" paper (the creative-brief surface) ---- */\n  --gm-manila: #F4E8CE;         /* warm folder paper */\n  --gm-manila-edge: #EADCB8;    /* folder tab / darker fold */\n  --gm-manila-line: rgba(120, 90, 40, 0.22); /* hairline on manila */\n  --gm-manila-label: #9A7B33;   /* mono field labels on manila */\n  --gm-manila-ink: #2B2310;     /* body text on manila */\n  --gm-indigo: #6366F1;         /* secondary accent — used sparingly */\n  --gm-green: #10B981;          /* success / positive delta */\n  --gm-red: #E5484D;            /* negative delta / alert */\n\n  /* ---- Neutral ramp (cool gray, paper → ink) ---- */\n  --gray-0:  #FFFFFF;\n  --gray-25: #FBFAF8;   /* warm paper */\n  --gray-50: #F5F5F4;\n  --gray-100:#ECECEA;\n  --gray-150:#E2E2DF;\n  --gray-200:#D4D6DA;\n  --gray-300:#B7BBC2;\n  --gray-400:#9098A3;\n  --gray-500:#6B7280;\n  --gray-600:#4B515B;\n  --gray-700:#343941;\n  --gray-800:#22262C;\n  --gray-900:#16181D;\n  --gray-950:#0A0A0F;\n\n  /* ---- Dark-surface ramp (layered near-blacks) ---- */\n  --night-0:  #0A0A0F;\n  --night-1:  #0D1117;  /* surface */\n  --night-2:  #12141C;  /* elevated */\n  --night-3:  #171A24;  /* raised */\n  --night-line: rgba(148, 163, 184, 0.12);\n  --night-line-strong: rgba(148, 163, 184, 0.22);\n\n  /* ============ SEMANTIC ALIASES ============ */\n\n  /* Surfaces — PAPER (default) */\n  --surface-page: var(--gray-25);\n  --surface-card: var(--gray-0);\n  --surface-sunken: var(--gray-50);\n  --surface-raised: var(--gray-0);\n\n  /* Surfaces — NIGHT */\n  --surface-night: var(--night-0);\n  --surface-night-card: var(--night-2);\n  --surface-night-raised: var(--night-3);\n\n  /* Text on paper */\n  --text-strong: var(--gray-900);\n  --text-body: var(--gray-700);\n  --text-muted: var(--gray-500);\n  --text-faint: var(--gray-400);\n  --text-on-accent: #FFFFFF;\n\n  /* Text on night */\n  --text-night-strong: #E6EDF3;\n  --text-night-body: #9BA7B4;\n  --text-night-faint: #697586;\n\n  /* Accent (primary action / links / data on light) */\n  --accent: var(--gm-teal);\n  --accent-hover: var(--gm-teal-deep);\n  --accent-contrast: #FFFFFF;\n  --accent-soft: rgba(11, 122, 140, 0.10);\n  --accent-soft-border: rgba(11, 122, 140, 0.22);\n\n  /* Accent on night */\n  --accent-night: var(--gm-cyan);\n  --accent-night-soft: rgba(0, 212, 255, 0.12);\n  --accent-night-glow: rgba(0, 212, 255, 0.35);\n\n  /* Outcome / human */\n  --outcome: var(--gm-amber);\n  --outcome-soft: rgba(245, 165, 36, 0.14);\n\n  /* Case-file surfaces */\n  --surface-brief: var(--gm-manila);\n  --text-on-brief: var(--gm-manila-ink);\n  --label-on-brief: var(--gm-manila-label);\n\n  /* Borders & dividers (on paper) */\n  --border: var(--gray-150);\n  --border-strong: var(--gray-200);\n  --border-faint: var(--gray-100);\n  --divider: var(--gray-150);\n\n  /* Status */\n  --positive: var(--gm-green);\n  --positive-soft: rgba(16, 185, 129, 0.12);\n  --negative: var(--gm-red);\n  --negative-soft: rgba(229, 72, 77, 0.12);\n\n  /* Focus ring */\n  --focus-ring: rgba(11, 122, 140, 0.45);\n}\n\n/* ============================================================\n   TYPOGRAPHY — GrowthMindset.ai\n   Display = Space Grotesk (headlines, numbers, eyebrows).\n   Body = Inter. Mono = JetBrains Mono (labels, data, node tags).\n   Tight, confident, executive. Type scale is a ~1.22 ratio.\n   ============================================================ */\n\n:root {\n  /* Families */\n  --font-display: 'Space Grotesk', ui-sans-serif, system-ui, sans-serif;\n  --font-body: 'Inter', ui-sans-serif, system-ui, -apple-system, sans-serif;\n  /* Typewriter — the \"case file\" voice (eyebrows, labels, stamps, flows) */\n  --font-mono: 'Courier Prime', ui-monospace, 'Courier New', monospace;\n  --font-typewriter: var(--font-mono);\n\n  /* Weights */\n  --weight-regular: 400;\n  --weight-medium: 500;\n  --weight-semibold: 600;\n  --weight-bold: 700;\n\n  /* Type scale (px) */\n  --text-display: 64px;   /* hero */\n  --text-h1: 48px;\n  --text-h2: 36px;\n  --text-h3: 27px;\n  --text-h4: 22px;\n  --text-lead: 20px;      /* intro paragraphs */\n  --text-body-lg: 18px;\n  --text-base: 16px;\n  --text-sm: 14px;\n  --text-xs: 13px;\n  --text-eyebrow: 12px;   /* mono uppercase kicker */\n\n  /* Line heights */\n  --leading-tight: 1.05;\n  --leading-snug: 1.18;\n  --leading-normal: 1.5;\n  --leading-relaxed: 1.65;\n\n  /* Letter spacing */\n  --tracking-tight: -0.025em;   /* display / h1 */\n  --tracking-snug: -0.015em;    /* h2 / h3 */\n  --tracking-normal: 0em;\n  --tracking-wide: 0.02em;\n  --tracking-eyebrow: 0.1em;    /* typewriter kickers, uppercase (Courier is wide) */\n}\n\n/* ============================================================\n   SPACING, RADII, SHADOWS — GrowthMindset.ai\n   4px base grid. Generous whitespace so complex thinking reads\n   as simple. Radii are restrained (premium, not bubbly).\n   Two shadow systems: soft ambient (paper) + cyan glow (night).\n   ============================================================ */\n\n:root {\n  /* ---- Spacing scale (4px grid) ---- */\n  --space-0: 0;\n  --space-1: 4px;\n  --space-2: 8px;\n  --space-3: 12px;\n  --space-4: 16px;\n  --space-5: 20px;\n  --space-6: 24px;\n  --space-8: 32px;\n  --space-10: 40px;\n  --space-12: 48px;\n  --space-16: 64px;\n  --space-20: 80px;\n  --space-24: 96px;\n  --space-32: 128px;\n\n  /* Section rhythm */\n  --section-y: 96px;       /* vertical padding for a page section */\n  --section-y-lg: 128px;\n  --gutter: 24px;          /* card / grid gutter */\n  --content-max: 1216px;   /* 76rem — max content width */\n  --reading-max: 680px;    /* comfortable prose measure */\n\n  /* ---- Radii ---- */\n  --radius-xs: 6px;\n  --radius-sm: 8px;\n  --radius: 12px;          /* default card */\n  --radius-md: 14px;\n  --radius-lg: 18px;\n  --radius-xl: 24px;\n  --radius-2xl: 28px;\n  --radius-pill: 999px;\n\n  /* ---- Borders ---- */\n  --border-width: 1px;\n  --border-width-strong: 1.5px;\n\n  /* ---- Shadows (paper) ---- */\n  --shadow-xs: 0 1px 2px rgba(16, 24, 40, 0.05);\n  --shadow-sm: 0 1px 3px rgba(16, 24, 40, 0.08), 0 1px 2px rgba(16, 24, 40, 0.04);\n  --shadow: 0 4px 12px -2px rgba(16, 24, 40, 0.08), 0 2px 6px -2px rgba(16, 24, 40, 0.05);\n  --shadow-md: 0 10px 24px -6px rgba(16, 24, 40, 0.10), 0 4px 10px -4px rgba(16, 24, 40, 0.06);\n  --shadow-lg: 0 22px 48px -12px rgba(16, 24, 40, 0.16), 0 8px 18px -8px rgba(16, 24, 40, 0.08);\n  --shadow-card: 0 1px 2px rgba(16, 24, 40, 0.04), 0 6px 20px -8px rgba(16, 24, 40, 0.10);\n\n  /* ---- Shadows (night) ---- */\n  --shadow-night: 0 1px 0 0 rgba(255,255,255,0.04) inset, 0 8px 30px -12px rgba(0,0,0,0.7);\n  --glow-cyan: 0 0 0 1px rgba(0,212,255,0.25), 0 0 40px -8px rgba(0,212,255,0.35);\n\n  /* ---- Motion ---- */\n  --ease-out: cubic-bezier(0.22, 1, 0.36, 1); /* @kind other */\n  --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1); /* @kind other */\n  --dur-fast: 140ms; /* @kind other */\n  --dur: 220ms; /* @kind other */\n  --dur-slow: 420ms; /* @kind other */\n}\n\n/* ============================================================\n   GrowthMindset.ai — Webfonts\n   Display: Space Grotesk (geometric grotesque, echoes the wordmark).\n   Body: Inter. Typewriter/mono: Courier Prime — the \"case file\"\n   voice: eyebrows, field labels, stamps, system-flow tags. Evokes a\n   classic typed creative brief. All loaded from Google Fonts.\n   ============================================================ */\n\n/* latin-ext */\n@font-face {\n  font-family: 'Courier Prime';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"5d90eb0a-ff97-4984-9238-8f0b9af812b6\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Courier Prime';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"fe885339-d827-4640-a492-5583dd01e93f\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n} ayIcon(false); return; }\n    }\n    this.show(n, false);\n    this.scheduleNext();\n  }\n\n  play() {\n    if (this.i >= this.len - 1 && !this.loopOn()) { this._shown = 0; this.show(0, true); }\n    this.playing = true;\n    this.setPlayIcon(true);\n    this.show(this.i, true);\n    this.scheduleNext();\n  }\n\n  pause() {\n    this.playing = false;\n    this.setPlayIcon(false);\n    clearTimeout(this.timer);\n    this.show(this.i, true);\n  }\n\n  toggle() { this.playing ? this.pause() : this.play(); }\n\n  onTap() {\n    if (this.playing) { this.pause(); return; }\n    let n = this.i + 1;\n    if (n >= this.len) { n = 0; this._shown = 0; if (this.scoreN) this.scoreN.textContent = '0'; }\n    this.show(n, n === 0);\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
